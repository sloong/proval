stages:
    - verify
    - build

.bun_verify:
    image: oven/bun:1.3.11
    stage: verify
    tags:
        - linux
        - docker
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_COMMIT_TAG'
    before_script:
        - sed -i -e 's|deb.debian.org/debian|mirrors.aliyun.com/debian|g' -e 's|security.debian.org/debian-security|mirrors.aliyun.com/debian-security|g' /etc/apt/sources.list
        - apt-get update && apt-get install -y git
        - bun install --frozen-lockfile

typecheck:
    extends: .bun_verify
    script:
        - bun run --filter @proval/db build
        - bun run --filter @proval/types build
        - bun run typecheck

test:
    extends: .bun_verify
    script:
        - bun run --filter @proval/db build
        - bun run --filter @proval/types build
        - bun run test

build:
    extends: .bun_verify
    script:
        - bun run --filter @proval/db build
        - bun run --filter @proval/types build
        - bun run build

docker_build:
    image: docker:24
    stage: verify
    tags:
        - linux
        - docker
    services:
        - docker:24-dind
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
        DOCKER_DRIVER: overlay2
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_COMMIT_TAG'
    script:
        - docker build -t proval:ci .

.docker_build:
    image: docker:24
    stage: build
    tags:
        - linux
        - docker
    services:
        - docker:24-dind
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
        DOCKER_DRIVER: overlay2
    rules:
        - if: "$CI_COMMIT_TAG"
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build_and_push:
    extends: .docker_build
    script:
        - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
        - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
